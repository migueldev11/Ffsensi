name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar NDK e CMake via sdkmanager
      run: |
        echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

    - name: Gerar Gradle Wrapper compativel (Versao 8.7)
      run: |
        rm -rf gradlew gradlew.bat gradle/
        sdkmanager --uninstall || true
        # Instalar o gradle de uma versao estavel via SDK ou usar o comando direto compativel
        gradle wrapper --gradle-version 8.7.0 --distribution-type bin

    - name: Compilar APK (Debug)
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Guardar o APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
